<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>텍사스 홀덤</title>
<style>
  :root {
    --felt: #0f6b3a;
    --felt-dark: #0a4a28;
    --wood: #5a3418;
    --gold: #f2c14e;
    --text: #f5f5f5;
    --muted: #b9d3c3;
    --red: #d62839;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #12261b;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: 1px; }

  .table {
    position: relative;
    width: 100%;
    max-width: 820px;
    aspect-ratio: 16 / 10;
    min-height: 420px;
    background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
    border: 14px solid var(--wood);
    border-radius: 200px;
    box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.5);
  }

  .center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .board { display: flex; gap: 6px; justify-content: center; min-height: 74px; }
  .pot { margin-top: 8px; font-weight: bold; color: var(--gold); font-size: 18px; }
  .stage { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .seat {
    position: absolute;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 150px;
  }
  .seat .box {
    background: rgba(0,0,0,.45);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 6px 8px;
    transition: border-color .2s, opacity .2s;
  }
  .seat.turn .box { border-color: var(--gold); box-shadow: 0 0 14px rgba(242,193,78,.6); }
  .seat.folded { opacity: .45; }
  .seat.out { opacity: .25; }
  .seat.winner .box { border-color: #6fe28c; box-shadow: 0 0 16px rgba(111,226,140,.7); }
  .name { font-weight: bold; font-size: 14px; }
  .chips { font-size: 13px; color: var(--gold); }
  .action { font-size: 12px; color: var(--muted); min-height: 16px; }
  .hand { display: flex; gap: 4px; justify-content: center; margin-bottom: 4px; min-height: 58px; }
  .bet-chip {
    display: inline-block;
    margin-top: 4px;
    background: var(--gold);
    color: #222;
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 12px;
    font-weight: bold;
  }
  .dealer {
    display: inline-block;
    background: #fff; color: #222;
    border-radius: 50%;
    width: 18px; height: 18px; line-height: 18px;
    font-size: 11px; font-weight: bold;
    margin-left: 4px;
  }

  .card {
    position: relative;
    width: 48px; height: 68px;
    background: linear-gradient(160deg, #ffffff 0%, #f3f0e8 100%);
    color: #1b1b1b;
    border-radius: 7px;
    border: 1px solid #d8d2c4;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: bold;
    box-shadow: 0 3px 6px rgba(0,0,0,.45);
    flex-shrink: 0;
  }
  .card .corner {
    position: absolute;
    display: flex; flex-direction: column; align-items: center;
    font-size: 13px; line-height: 1;
  }
  .card .corner.tl { top: 4px; left: 4px; }
  .card .corner.br { bottom: 4px; right: 4px; transform: rotate(180deg); }
  .card .corner small { font-size: 11px; }
  .card .pip {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .card .pip.face { font-size: 28px; text-shadow: 1px 1px 0 rgba(242,193,78,.8); }
  .card.red { color: var(--red); }
  .card.back {
    background:
      radial-gradient(circle at center, rgba(255,255,255,.18) 0 18%, transparent 19%),
      repeating-linear-gradient(45deg, #8e1f2f 0 4px, #6e1624 4px 8px);
    border: 3px solid #fff;
    box-shadow: inset 0 0 0 2px #8e1f2f, 0 3px 6px rgba(0,0,0,.45);
  }
  .card.big { width: 58px; height: 82px; }
  .card.big .corner { font-size: 15px; }
  .card.big .pip { font-size: 32px; }
  .card.big .pip.face { font-size: 34px; }
  .card.hl { box-shadow: 0 0 0 3px #6fe28c, 0 0 14px rgba(111,226,140,.9); transform: translateY(-4px); }
  .card.deal { animation: deal .35s ease-out; }
  .card.flip { animation: flip .45s ease-out; }
  @keyframes deal {
    from { transform: translateY(-40px) scale(.6) rotate(-12deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  @keyframes flip {
    0%   { transform: rotateY(90deg); }
    100% { transform: rotateY(0); }
  }
  .sound-btn {
    position: fixed; top: 12px; right: 12px;
    background: rgba(0,0,0,.4); font-size: 18px; padding: 6px 10px;
  }

  .seat-0 { top: 88%; left: 50%; }
  .seat-1 { top: 50%; left: 9%; }
  .seat-2 { top: 10%; left: 50%; }
  .seat-3 { top: 50%; left: 91%; }

  .controls {
    margin-top: 18px;
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; align-items: center;
    width: 100%; max-width: 820px;
  }
  button {
    font: inherit; font-weight: bold;
    border: none; border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    color: #fff;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  #btnFold { background: #8a2b2b; }
  #btnCall { background: #2b6a8a; }
  #btnRaise { background: #b07a12; }
  #btnAllIn { background: #6b2b8a; }
  #btnNext { background: #2b8a4a; }
  .raise-box { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .raise-box input[type=range] { width: 140px; }

  .message {
    margin-top: 12px; min-height: 24px;
    font-size: 16px; font-weight: bold; color: var(--gold);
    text-align: center;
  }
  .log {
    margin-top: 10px;
    width: 100%; max-width: 820px;
    height: 120px; overflow-y: auto;
    background: rgba(0,0,0,.35);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px; color: var(--muted);
  }

  @media (max-width: 600px) {
    .table { border-width: 8px; border-radius: 90px; aspect-ratio: 3 / 4.4; }
    .seat { width: 110px; }
    .card { width: 36px; height: 52px; }
    .card .corner { font-size: 11px; }
    .card .corner small { font-size: 9px; }
    .card .pip { font-size: 18px; }
    .card .pip.face { font-size: 20px; }
    .card.big { width: 44px; height: 62px; }
    .card.big .corner { font-size: 12px; }
    .card.big .pip { font-size: 24px; }
    .card.big .pip.face { font-size: 24px; }
    .hand { min-height: 46px; }
    .seat-1 { left: 16%; top: 28%; }
    .seat-3 { left: 84%; top: 28%; }
    .center { top: 55%; }
    .seat-2 { top: 12%; }
    .seat-0 { top: 85%; }
    .message { margin-top: 20px; }
  }
</style>
</head>
<body>
  <h1>♠ 텍사스 홀덤 ♥</h1>
  <button class="sound-btn" id="btnSound" title="소리 켜기/끄기">🔊</button>

  <div class="table" id="table">
    <div class="center">
      <div class="board" id="board"></div>
      <div class="pot" id="pot">팟: 0</div>
      <div class="stage" id="stage"></div>
    </div>
  </div>

  <div class="message" id="message"></div>

  <div class="controls">
    <button id="btnFold">폴드</button>
    <button id="btnCall">체크</button>
    <div class="raise-box">
      <input type="range" id="raiseSlider" min="0" max="0" step="10">
      <span id="raiseValue">0</span>
    </div>
    <button id="btnRaise">레이즈</button>
    <button id="btnAllIn">올인</button>
    <button id="btnNext">다음 판</button>
  </div>

  <div class="log" id="log"></div>

<script>
// ===== 설정 =====
const START_CHIPS = 1000;
const SMALL_BLIND = 10;
const BIG_BLIND = 20;
const BOT_DELAY = 700;   // 컴퓨터가 생각하는 시간(ms)

const SUITS = ['♠', '♥', '♦', '♣'];
const RANK_NAMES = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
const HAND_NAMES = ['하이카드', '원페어', '투페어', '트리플', '스트레이트',
                    '플러시', '풀하우스', '포카드', '스트레이트 플러시'];
const STAGE_NAMES = { preflop: '프리플랍', flop: '플랍', turn: '턴', river: '리버', showdown: '쇼다운' };

// ===== 게임 상태 =====
const players = [
  { name: '나', isHuman: true },
  { name: '철수봇' },
  { name: '영희봇' },
  { name: '민수봇' },
].map(p => ({ ...p, chips: START_CHIPS, hand: [], folded: false, allIn: false,
              bet: 0, total: 0, acted: false, out: false, lastAction: '' }));

let deck = [];
let board = [];
let dealer = 0;
let stage = 'preflop';
let currentBet = 0;
let minRaise = BIG_BLIND;
let toAct = -1;
let handOver = true;
let winners = [];

// ===== 카드 =====
function newDeck() {
  const d = [];
  for (let s = 0; s < 4; s++) for (let r = 2; r <= 14; r++) d.push({ r, s });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
const rankText = r => RANK_NAMES[r] || String(r);
const cardText = c => rankText(c.r) + SUITS[c.s];

// ===== 족보 계산 =====
// 5장 → [족보 번호, 비교용 숫자들...] (클수록 강함)
function eval5(cards) {
  const ranks = cards.map(c => c.r).sort((a, b) => b - a);
  const flush = cards.every(c => c.s === cards[0].s);
  const uniq = [...new Set(ranks)];
  let straightHigh = 0;
  if (uniq.length === 5) {
    if (ranks[0] - ranks[4] === 4) straightHigh = ranks[0];
    else if (ranks.join() === '14,5,4,3,2') straightHigh = 5;  // A-2-3-4-5
  }
  const counts = {};
  ranks.forEach(r => counts[r] = (counts[r] || 0) + 1);
  const groups = Object.entries(counts)
    .map(([r, n]) => [Number(r), n])
    .sort((a, b) => b[1] - a[1] || b[0] - a[0]);
  const byGroup = groups.map(g => g[0]);
  const shape = groups.map(g => g[1]).join('');

  if (straightHigh && flush) return [8, straightHigh];
  if (shape === '41') return [7, ...byGroup];
  if (shape === '32') return [6, ...byGroup];
  if (flush) return [5, ...ranks];
  if (straightHigh) return [4, straightHigh];
  if (shape === '311') return [3, ...byGroup];
  if (shape === '221') return [2, ...byGroup];
  if (shape === '2111') return [1, ...byGroup];
  return [0, ...ranks];
}

function compareScore(a, b) {
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const d = (a[i] || 0) - (b[i] || 0);
    if (d) return d;
  }
  return 0;
}

// 5~7장 중 가장 좋은 5장 조합
function bestHand(cards) {
  let best = null;
  const n = cards.length;
  for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++)
  for (let c = b + 1; c < n; c++) for (let d = c + 1; d < n; d++)
  for (let e = d + 1; e < n; e++) {
    const five = [cards[a], cards[b], cards[c], cards[d], cards[e]];
    const score = eval5(five);
    if (!best || compareScore(score, best.score) > 0) best = { score, cards: five };
  }
  return best;
}

function handName(score) {
  if (score[0] === 8 && score[1] === 14) return '로열 플러시';
  return HAND_NAMES[score[0]];
}

// ===== 진행 =====
const activeSeats = () => players.map((p, i) => i).filter(i => !players[i].out);
const inHand = () => players.filter(p => !p.out && !p.folded);
const canAct = () => players.filter(p => !p.out && !p.folded && !p.allIn);
const potTotal = () => players.reduce((s, p) => s + p.total, 0);

function nextSeat(from, test) {
  for (let k = 1; k <= players.length; k++) {
    const i = (from + k) % players.length;
    if (test(players[i])) return i;
  }
  return -1;
}

function log(msg) {
  const el = document.getElementById('log');
  el.innerHTML += `<div>${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function putChips(p, amount) {
  amount = Math.min(amount, p.chips);
  p.chips -= amount;
  p.bet += amount;
  p.total += amount;
  if (p.chips === 0) p.allIn = true;
  return amount;
}

function startHand() {
  players.forEach(p => { if (p.chips <= 0) p.out = true; });
  if (players[0].out) { setMessage('칩을 모두 잃었어요 😢 새로고침하면 다시 시작해요.'); render(); return; }
  if (activeSeats().length === 1) { setMessage('🏆 모든 컴퓨터를 이겼어요! 우승!'); render(); return; }

  deck = newDeck();
  board = [];
  winners = [];
  shownBack.clear();
  shownFace.clear();
  handOver = false;
  players.forEach(p => Object.assign(p, { hand: [], folded: false, allIn: false,
                                          bet: 0, total: 0, acted: false, lastAction: '' }));
  dealer = nextSeat(dealer, p => !p.out);

  const live = p => !p.out;
  const headsUp = activeSeats().length === 2;
  const sb = headsUp ? dealer : nextSeat(dealer, live);
  const bb = nextSeat(sb, live);

  players.forEach(p => { if (!p.out) p.hand = [deck.pop(), deck.pop()]; });
  for (let k = 0; k < activeSeats().length * 2; k++) play('deal', k * 0.07);

  stage = 'preflop';
  putChips(players[sb], SMALL_BLIND); players[sb].lastAction = `스몰 블라인드 ${players[sb].bet}`;
  putChips(players[bb], BIG_BLIND);   players[bb].lastAction = `빅 블라인드 ${players[bb].bet}`;
  currentBet = BIG_BLIND;
  minRaise = BIG_BLIND;

  log(`<b>── 새 판 시작 ──</b> 딜러: ${players[dealer].name}`);
  setMessage('');
  toAct = bb;
  advance();
}

function roundComplete() {
  const actors = canAct();
  if (actors.length === 0) return true;
  // 나머지가 모두 올인이고 혼자 남은 사람이 금액을 맞췄으면 더 베팅할 상대가 없음
  if (actors.length === 1 && actors[0].bet >= currentBet) return true;
  return actors.every(p => p.acted && p.bet === currentBet);
}

function advance() {
  if (inHand().length === 1) return finishHand();
  if (roundComplete()) {
    toAct = -1;   // 다음 카드가 깔릴 때까지 아무도 행동하지 않음
    render();
    return setTimeout(nextStage, BOT_DELAY);
  }

  toAct = nextSeat(toAct, p => !p.out && !p.folded && !p.allIn && (!p.acted || p.bet < currentBet));
  render();
  if (players[toAct].isHuman) {
    setMessage('당신 차례예요!');
    play('turn');
    const slider = document.getElementById('raiseSlider');
    slider.value = slider.min;   // 레이즈 금액은 최소값부터
    document.getElementById('raiseValue').textContent = slider.value;
  } else {
    setTimeout(() => botAct(toAct), BOT_DELAY);
  }
}

function nextStage() {
  players.forEach(p => { p.bet = 0; p.acted = false; });
  currentBet = 0;
  minRaise = BIG_BLIND;

  if (stage === 'preflop') { stage = 'flop'; board.push(deck.pop(), deck.pop(), deck.pop()); }
  else if (stage === 'flop') { stage = 'turn'; board.push(deck.pop()); }
  else if (stage === 'turn') { stage = 'river'; board.push(deck.pop()); }
  else { stage = 'showdown'; return finishHand(); }

  log(`[${STAGE_NAMES[stage]}] ${board.map(cardText).join(' ')}`);
  (stage === 'flop' ? [0, 0.1, 0.2] : [0]).forEach(d => play('deal', d));
  toAct = dealer;   // 딜러 다음 사람부터
  advance();
}

// action: 'fold' | 'call' | 'raise' (raiseTo = 이번 라운드 총 베팅액)
function act(i, action, raiseTo) {
  const p = players[i];
  if (action === 'fold') {
    p.folded = true;
    p.lastAction = '폴드';
  } else if (action === 'call') {
    const need = currentBet - p.bet;
    if (need === 0) p.lastAction = '체크';
    else p.lastAction = `콜 ${putChips(p, need)}`;
  } else {
    raiseTo = Math.min(raiseTo, p.bet + p.chips);
    const before = currentBet;
    putChips(p, raiseTo - p.bet);
    if (p.bet > before) {
      if (p.bet - before >= minRaise) minRaise = p.bet - before;
      currentBet = p.bet;
      players.forEach(o => { if (o !== p) o.acted = false; });
    }
    p.lastAction = p.allIn ? `올인 ${p.bet}` : (before === 0 ? `벳 ${p.bet}` : `레이즈 ${p.bet}`);
  }
  if (p.allIn && !p.lastAction.startsWith('올인') && action !== 'fold') p.lastAction += ' (올인)';
  if (action === 'fold') play('fold');
  else if (p.allIn) play('allin');
  else if (p.lastAction === '체크') play('check');
  else play('chip');
  p.acted = true;
  log(`${p.name}: ${p.lastAction}`);
  advance();
}

function finishHand() {
  setTimeout(() => {
    if (winners.includes(players[0])) play('win');
    else if (!players[0].folded) play('lose');
  }, 300);
  handOver = true;
  toAct = -1;
  const alive = inHand();

  if (alive.length === 1) {
    const w = alive[0];
    const won = potTotal();
    w.chips += won;
    winners = [w];
    log(`🏆 ${w.name} +${won} (나머지 모두 폴드)`);
    setMessage(`${w.name} 승리! +${won}`);
  } else {
    // 모자란 보드 카드 채우기 (모두 올인한 경우)
    while (board.length < 5) board.push(deck.pop());
    stage = 'showdown';
    alive.forEach(p => {
      p.best = bestHand([...p.hand, ...board]);
      log(`${p.name}: ${p.hand.map(cardText).join(' ')} → ${handName(p.best.score)}`);
    });

    // 사이드 팟 계산: 기여한 금액 단계별로 나눔
    const levels = [...new Set(alive.map(p => p.total))].sort((a, b) => a - b);
    let prev = 0;
    const results = [];
    const gained = new Map();
    levels.forEach(level => {
      const pot = players.reduce((s, p) => s + Math.max(0, Math.min(p.total, level) - prev), 0);
      const eligible = alive.filter(p => p.total >= level);
      let top = [];
      eligible.forEach(p => {
        if (!top.length) top = [p];
        else {
          const c = compareScore(p.best.score, top[0].best.score);
          if (c > 0) top = [p];
          else if (c === 0) top.push(p);
        }
      });
      const share = Math.floor(pot / top.length);
      top.forEach((p, k) => {
        const amt = share + (k === 0 ? pot - share * top.length : 0);
        p.chips += amt;
        gained.set(p, (gained.get(p) || 0) + amt);
      });
      prev = level;
    });
    winners = [...gained.keys()];
    gained.forEach((amt, p) => results.push(`${p.name} +${amt} (${handName(p.best.score)})`));
    log(`🏆 ${results.join(', ')}`);
    setMessage(`🏆 ${results.join(' / ')}`);
  }
  render();
}

// ===== 컴퓨터 AI =====
function handStrength(p) {
  const [a, b] = p.hand;
  if (board.length === 0) {
    const hi = Math.max(a.r, b.r), lo = Math.min(a.r, b.r);
    let s;
    if (hi === lo) s = 0.5 + hi / 28;
    else {
      s = (hi + lo) / 32;
      if (a.s === b.s) s += 0.06;
      if (hi - lo <= 2) s += 0.04;
    }
    return Math.min(1, s);
  }
  const best = bestHand([...p.hand, ...board]);
  const base = [0.15, 0.45, 0.65, 0.75, 0.82, 0.86, 0.92, 0.97, 1][best.score[0]];
  let s = base;
  if (best.score[0] === 1) s += (best.score[1] - 8) / 40;   // 높은 원페어는 더 강하게
  if (best.score[0] === 0) s += (best.score[1] - 10) / 40;
  return Math.max(0, Math.min(1, s));
}

function botAct(i) {
  if (handOver || toAct !== i) return;
  const p = players[i];
  const s = handStrength(p) + (Math.random() - 0.5) * 0.15;
  const toCall = currentBet - p.bet;
  const pot = potTotal();
  const odds = toCall / (pot + toCall || 1);
  const r = Math.random();
  const raiseSize = Math.max(currentBet + minRaise, currentBet + Math.round(pot * (0.5 + Math.random() * 0.5) / 10) * 10);

  if (s > 0.85 && r < 0.75) return act(i, 'raise', raiseSize);
  if (s > 0.65 && r < 0.3) return act(i, 'raise', currentBet + minRaise);
  if (toCall === 0) {
    if (r < 0.08) return act(i, 'raise', currentBet + minRaise);   // 가끔 블러핑
    return act(i, 'call');
  }
  if (s >= odds + 0.2 || (toCall <= BIG_BLIND && s > 0.3)) return act(i, 'call');
  return act(i, 'fold');
}

// ===== 효과음 (Web Audio로 직접 합성, 파일 필요 없음) =====
let audioCtx = null;
let soundOn = true;

function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, start, dur, type = 'sine', vol = 0.2, endFreq) {
  const ctx = ac();
  const t = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + dur);
}

function noise(start, dur, vol = 0.25, freq = 3000) {
  const ctx = ac();
  const t = ctx.currentTime + start;
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = freq;
  const g = ctx.createGain();
  g.gain.value = vol;
  src.connect(filter).connect(g).connect(ctx.destination);
  src.start(t);
}

const SOUNDS = {
  deal:  (d = 0) => noise(d, 0.08, 0.35, 2500),                          // 카드 스윽
  chip:  () => { tone(2200, 0, 0.08, 'triangle', 0.15); tone(2900, 0.05, 0.1, 'triangle', 0.12); },
  allin: () => { for (let k = 0; k < 6; k++) tone(1800 + Math.random() * 1200, k * 0.05, 0.1, 'triangle', 0.12); },
  check: () => { tone(160, 0, 0.08, 'sine', 0.5); tone(160, 0.12, 0.08, 'sine', 0.5); },   // 똑똑
  fold:  () => noise(0, 0.25, 0.2, 900),
  turn:  () => { tone(880, 0, 0.25, 'sine', 0.15); tone(1320, 0.12, 0.3, 'sine', 0.1); },
  win:   () => [523, 659, 784, 1047].forEach((f, k) => tone(f, k * 0.12, 0.35, 'triangle', 0.2)),
  lose:  () => { tone(392, 0, 0.3, 'sine', 0.15); tone(330, 0.25, 0.45, 'sine', 0.15); },
};

function play(name, ...args) {
  if (!soundOn) return;
  try { SOUNDS[name](...args); } catch (e) { /* 소리를 못 내도 게임은 계속 */ }
}

// ===== 화면 =====
// 카드가 처음 나타날 때만 애니메이션을 주려고 이미 그린 카드를 기억해 둠
const shownBack = new Set();
const shownFace = new Set();

function cardHTML(c, opts = {}) {
  if (!c) return '';
  const big = opts.big ? ' big' : '';
  if (opts.hidden) {
    const anim = shownBack.has(c) ? '' : ' deal';
    shownBack.add(c);
    return `<div class="card back${big}${anim}"></div>`;
  }
  const anim = shownFace.has(c) ? '' : (shownBack.has(c) ? ' flip' : ' deal');
  shownFace.add(c);
  const red = c.s === 1 || c.s === 2;
  const rank = rankText(c.r);
  const suit = SUITS[c.s];
  const center = c.r >= 11 && c.r <= 13 ? `<div class="pip face">${rank}</div>` : `<div class="pip">${suit}</div>`;
  return `<div class="card${red ? ' red' : ''}${big}${opts.hl ? ' hl' : ''}${anim}">
            <div class="corner tl">${rank}<small>${suit}</small></div>
            ${center}
            <div class="corner br">${rank}<small>${suit}</small></div>
          </div>`;
}

function setMessage(m) { document.getElementById('message').innerHTML = m; }

function render() {
  const table = document.getElementById('table');
  table.querySelectorAll('.seat').forEach(el => el.remove());

  const showdown = handOver && inHand().length > 1;
  const winCards = new Set();
  if (showdown) winners.forEach(w => w.best && w.best.cards.forEach(c => winCards.add(c)));

  players.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = `seat seat-${i}` +
      (i === toAct ? ' turn' : '') +
      (p.folded ? ' folded' : '') +
      (p.out ? ' out' : '') +
      (winners.includes(p) ? ' winner' : '');
    const reveal = p.isHuman || (showdown && !p.folded);
    const cards = p.hand.map(c => cardHTML(c, { hidden: !reveal, hl: winCards.has(c) })).join('');
    el.innerHTML = `
      <div class="hand">${cards}</div>
      <div class="box">
        <div class="name">${p.name}${i === dealer && !p.out ? '<span class="dealer">D</span>' : ''}</div>
        <div class="chips">💰 ${p.out ? '탈락' : p.chips}</div>
        <div class="action">${p.lastAction}</div>
      </div>
      ${p.bet > 0 ? `<div class="bet-chip">${p.bet}</div>` : ''}`;
    table.appendChild(el);
  });

  document.getElementById('board').innerHTML =
    board.map(c => cardHTML(c, { big: true, hl: winCards.has(c) })).join('');
  document.getElementById('pot').textContent = `팟: ${handOver && winners.length ? 0 : potTotal()}`;
  let stageText = handOver ? '' : STAGE_NAMES[stage];
  const me = players[0];
  if (!me.out && me.hand.length && board.length >= 3 && !me.folded) {
    stageText += ` · 내 패: ${handName(bestHand([...me.hand, ...board]).score)}`;
  }
  document.getElementById('stage').textContent = stageText;

  renderControls();
}

function renderControls() {
  const me = players[0];
  const myTurn = !handOver && toAct === 0;
  const toCall = currentBet - me.bet;
  const minTo = Math.min(currentBet + minRaise, me.bet + me.chips);
  const maxTo = me.bet + me.chips;

  const btnFold = document.getElementById('btnFold');
  const btnCall = document.getElementById('btnCall');
  const btnRaise = document.getElementById('btnRaise');
  const btnAllIn = document.getElementById('btnAllIn');
  const slider = document.getElementById('raiseSlider');

  btnFold.disabled = !myTurn;
  btnCall.disabled = !myTurn;
  btnCall.textContent = toCall > 0 ? `콜 ${Math.min(toCall, me.chips)}` : '체크';
  btnRaise.disabled = !myTurn || me.chips <= toCall;
  btnRaise.textContent = currentBet === 0 ? '벳' : '레이즈';
  btnAllIn.disabled = !myTurn;
  slider.disabled = btnRaise.disabled;

  if (myTurn) {
    slider.max = maxTo;
    slider.min = minTo;
  }
  document.getElementById('raiseValue').textContent = slider.value;

  const gameOver = players[0].out || activeSeats().length === 1;
  document.getElementById('btnNext').disabled = !handOver || (gameOver && !players[0].out && activeSeats().length === 1);
  document.getElementById('btnNext').textContent = handOver && board.length === 0 && !winners.length ? '게임 시작' : '다음 판';
}

// ===== 버튼 =====
document.getElementById('btnFold').onclick = () => act(0, 'fold');
document.getElementById('btnCall').onclick = () => act(0, 'call');
document.getElementById('btnRaise').onclick = () => act(0, 'raise', +document.getElementById('raiseSlider').value);
document.getElementById('btnAllIn').onclick = () => act(0, 'raise', players[0].bet + players[0].chips);
document.getElementById('btnNext').onclick = () => {
  if (players[0].out) return location.reload();
  startHand();
};
document.getElementById('raiseSlider').oninput = e =>
  document.getElementById('raiseValue').textContent = e.target.value;

document.getElementById('btnSound').onclick = e => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? '🔊' : '🔇';
};

dealer = players.length - 1;  // 첫 판은 '나'가 딜러
render();
setMessage('"게임 시작"을 눌러 시작하세요!');
</script>
